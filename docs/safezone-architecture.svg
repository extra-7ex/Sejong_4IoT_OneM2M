<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">SafeZone verified call flow and MEC target</title>
  <desc id="desc">Current Pi call flow for radar, VisionAI, RiskEngine, oneM2M alerts, ESP devices, bridge, and dashboard. The Mp1 MEC011 link is a target and was not live-verified.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#35506b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2779a8"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1e2e40; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526579; }
      .box { fill: #ffffff; stroke: #8ca1b5; stroke-width: 2; rx: 14; }
      .boxBlue { fill: #eef7fc; stroke: #4c91b7; stroke-width: 2; rx: 14; }
      .boxGreen { fill: #eef8f3; stroke: #4d9b78; stroke-width: 2; rx: 14; }
      .boxOrange { fill: #fff5e9; stroke: #cc8741; stroke-width: 2; rx: 14; }
      .boxPurple { fill: #f4f0fb; stroke: #8868aa; stroke-width: 2; rx: 14; }
      .nodeTitle { font-size: 18px; font-weight: 700; }
      .nodeText { font-size: 14px; fill: #526579; }
      .label { font-size: 13px; font-weight: 600; fill: #344d64; }
      .pi { fill: #fbfdff; stroke: #7e9bb2; stroke-width: 2.5; rx: 22; }
      .piTitle { font-size: 19px; font-weight: 700; fill: #38556f; }
      .edge { fill: none; stroke: #35506b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edgeBi { fill: none; stroke: #35506b; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edgeBlue { fill: none; stroke: #2779a8; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .edgeOrange { fill: none; stroke: #c47a32; stroke-width: 2.5; marker-end: url(#arrow); }
      .target { fill: none; stroke: #8b6cab; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .divider { stroke: #dce5ed; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1160" fill="#f4f7fa"/>
  <text x="48" y="54" class="title">SafeZone · verified call flow</text>
  <text x="48" y="82" class="subtitle">Pi deployment and reported model tests, 20 Nov 2026 · dotted Mp1/MEC011 link is a target, not a live integration</text>

  <rect x="285" y="112" width="1005" height="840" class="pi"/>
  <text x="315" y="146" class="piTitle">Raspberry Pi edge node</text>

  <!-- External devices and inputs -->
  <rect x="35" y="188" width="210" height="88" class="box"/>
  <text x="58" y="222" class="nodeTitle">LD2450 radar</text>
  <text x="58" y="247" class="nodeText">non-oneM2M sensor</text>
  <rect x="35" y="363" width="210" height="88" class="box"/>
  <text x="58" y="397" class="nodeTitle">Logitech C270</text>
  <text x="58" y="422" class="nodeText">USB camera</text>

  <rect x="315" y="177" width="250" height="110" class="boxBlue"/>
  <text x="337" y="211" class="nodeTitle">Radar Collection IPE</text>
  <text x="337" y="237" class="nodeText">MN-AE · UART input</text>
  <text x="337" y="259" class="nodeText">MQTT radar CIN create</text>
  <rect x="315" y="350" width="250" height="110" class="boxGreen"/>
  <text x="337" y="384" class="nodeTitle">VisionAI</text>
  <text x="337" y="410" class="nodeText">processes camera video</text>
  <text x="337" y="432" class="nodeText">HTTP fusedTracks CIN</text>

  <rect x="700" y="265" width="285" height="125" class="boxPurple"/>
  <text x="724" y="303" class="nodeTitle">tinyIoT MN-CSE</text>
  <text x="724" y="330" class="nodeText">oneM2M CSE · Pi edge service</text>
  <text x="724" y="355" class="nodeText">MEC App role in reference diagram</text>
  <text x="724" y="376" class="nodeText">Mca resources and subscriptions</text>

  <rect x="1030" y="265" width="230" height="125" class="boxOrange"/>
  <text x="1053" y="303" class="nodeTitle">RiskEngine</text>
  <text x="1053" y="330" class="nodeText">separate install snapshot</text>
  <text x="1053" y="355" class="nodeText">HTTP polling + HTTP writes</text>
  <text x="1053" y="376" class="nodeText">2.5 m warning · 1.5 m danger</text>

  <!-- Resource path -->
  <rect x="315" y="520" width="180" height="95" class="box"/>
  <text x="335" y="556" class="nodeTitle">radar CNT</text>
  <text x="335" y="582" class="nodeText">AE-forklift01</text>
  <rect x="510" y="520" width="190" height="95" class="box"/>
  <text x="530" y="556" class="nodeTitle">fusedTracks CNT</text>
  <text x="530" y="582" class="nodeText">AE-VisionAI</text>
  <rect x="715" y="520" width="190" height="95" class="boxOrange"/>
  <text x="735" y="556" class="nodeTitle">events CNT</text>
  <text x="735" y="582" class="nodeText">AE-riskengine</text>

  <rect x="920" y="490" width="340" height="55" class="boxPurple"/>
  <text x="943" y="524" class="nodeTitle">grp-safezone-alarms · /fopt</text>
  <rect x="920" y="558" width="105" height="62" class="box"/>
  <text x="932" y="583" class="nodeText">Forklift</text><text x="932" y="603" class="nodeText">alert CNT</text>
  <rect x="1038" y="558" width="105" height="62" class="box"/>
  <text x="1054" y="583" class="nodeText">Worker</text><text x="1054" y="603" class="nodeText">alert CNT</text>
  <rect x="1155" y="558" width="105" height="62" class="box"/>
  <text x="1167" y="583" class="nodeText">Zone alert</text><text x="1175" y="603" class="nodeText">CNT · no device</text>

  <!-- App and system flows -->
  <path d="M245 232 H315" class="edge"/><text x="250" y="218" class="label">UART</text>
  <path d="M245 407 H315" class="edge"/><text x="248" y="393" class="label">USB</text>
  <path d="M565 232 H635 V300 H700" class="edgeBlue"/><text x="580" y="218" class="label">Mca · MQTT</text>
  <path d="M565 405 H635 V355 H700" class="edgeBlue"/><text x="580" y="427" class="label">Mca · HTTP</text>
  <path d="M985 327 H1030" class="edgeBi"/><text x="990" y="250" class="label">Mca · HTTP GET / POST</text>
  <path d="M842 390 V455 H405 V520" class="edge"/>
  <path d="M842 455 H605 V520" class="edge"/>
  <path d="M842 455 H810 V520" class="edge"/>
  <path d="M1145 390 V470 H810 V520" class="edgeOrange"/>
  <path d="M1145 390 V490" class="edgeOrange"/>
  <path d="M1090 545 V550 H972 V558" class="edge"/>
  <path d="M1090 550 V558" class="edge"/>
  <path d="M1090 550 H1207 V558" class="edge"/>
  <text x="930" y="469" class="label">HTTP POST /fopt · DANGER in all 3 CNTs verified</text>

  <!-- Health IPE, bridge, dashboard, and external MEC/IN -->
  <rect x="315" y="710" width="250" height="105" class="boxGreen"/>
  <text x="337" y="745" class="nodeTitle">Vision service-health IPE</text>
  <text x="337" y="772" class="nodeText">reads freshness + cam_ok</text>
  <text x="337" y="795" class="nodeText">writes status · no video inference</text>
  <rect x="640" y="710" width="230" height="105" class="boxBlue"/>
  <text x="662" y="745" class="nodeTitle">MN→IN bridge AE</text>
  <text x="662" y="772" class="nodeText">HTTP polling on MN</text>
  <text x="662" y="795" class="nodeText">HTTP event summary to IN</text>
  <rect x="930" y="710" width="220" height="105" class="box"/>
  <text x="953" y="745" class="nodeTitle">Dashboard AE</text>
  <text x="953" y="772" class="nodeText">MN live state + IN history</text>
  <text x="953" y="795" class="nodeText">HTTP/Mca calls</text>
  <rect x="1340" y="710" width="225" height="105" class="box"/>
  <text x="1361" y="745" class="nodeTitle">Laptop Docker IN-CSE</text>
  <text x="1361" y="772" class="nodeText">event history store</text>
  <text x="1361" y="795" class="nodeText">bridge uses Mca, not Mcc</text>
  <rect x="1340" y="150" width="225" height="115" class="boxPurple"/>
  <text x="1361" y="188" class="nodeTitle">ETSI MEC Platform</text>
  <text x="1361" y="216" class="nodeText">Mp1 · MEC011</text>
  <text x="1361" y="240" class="nodeText">target; not live-verified</text>

  <path d="M565 760 H705 V420 H842 V390" class="edge"/>
  <text x="575" y="694" class="label">Mca · GET Vision state / POST health</text>
  <path d="M755 815 V850 H1275 V410 H880 V390" class="edgeBi"/>
  <text x="790" y="875" class="label">Mca · HTTP polling / summary write</text>
  <path d="M755 815 V865 H1450 V815" class="edge"/>
  <path d="M1040 710 V675 H1280 V435 H960 V390" class="edge"/>
  <path d="M1150 760 H1340" class="edge"/>
  <text x="1157" y="744" class="label">Mca read</text>
  <path d="M842 265 V160 H1320 V207 H1340" class="target"/>
  <text x="1030" y="150" class="label">Mp1 · service registration / discovery target</text>

  <!-- Device notification outputs -->
  <rect x="510" y="1005" width="285" height="100" class="boxOrange"/>
  <text x="533" y="1041" class="nodeTitle">Forklift ESP</text>
  <text x="533" y="1068" class="nodeText">SG90 fork servo + buzzer</text>
  <text x="533" y="1090" class="nodeText">dated model tests · not drive motor</text>
  <rect x="850" y="1005" width="285" height="100" class="boxGreen"/>
  <text x="873" y="1041" class="nodeTitle">Worker ESP</text>
  <text x="873" y="1068" class="nodeText">buzzer + LED · DANGER mode observed</text>
  <text x="873" y="1090" class="nodeText">SUB nu=Cworker01 → AE poa</text>
  <path d="M972 620 V965 H652 V1005" class="edgeBlue"/>
  <text x="660" y="948" class="label">Mca · SUB HTTP /notify · earlier model test</text>
  <path d="M1090 620 V980 H992 V1005" class="edgeBlue"/>
  <text x="1005" y="964" class="label">Mca · SUB notification</text>

  <!-- Legend -->
  <line x1="45" y1="1133" x2="105" y2="1133" class="edge"/>
  <text x="118" y="1138" class="nodeText">Solid: deployed path or dated test</text>
  <line x1="430" y1="1133" x2="490" y2="1133" class="target"/>
  <text x="503" y="1138" class="nodeText">Dotted: unverified target</text>
  <text x="820" y="1138" class="nodeText">Current Vision test: fresh fusedTracks, tracks=[] · continuous service not verified</text>
</svg>
