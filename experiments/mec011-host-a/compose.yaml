services:
  redis:
    image: redis:7-alpine
    networks:
      trial:
        aliases:
          - meep-redis-master.default.svc.cluster.local
  mep:
    build:
      context: ./upstream
      dockerfile: ../Dockerfile
    environment:
      MEEP_SANDBOX_NAME: safezone-a
      MEEP_MEP_NAME: mep-a
      MEEP_HOST_URL: http://localhost:18080
    depends_on:
      - redis
    networks:
      - trial
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mep
    networks:
      - trial
  mock-vision:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./mock-vision.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - trial
networks:
  trial:
